<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scheduler App (Staged)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; margin: 2rem; background: #f7f7f7; }
        .container { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);}
        h1 { color: #2c3e50; }
        .calendar { margin-top: 2rem; }
        .calendar-table { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; }
        .calendar-table th, .calendar-table td { border: 1px solid #e1e4e8; padding: 0.5em 0.2em; min-width: 90px; height: 60px; vertical-align: top; position: relative; }
        .calendar-table th { background: #f0f3f6; color: #2c3e50; text-align: center; font-weight: 600; }
        .calendar-table td.today { background: #e3f2fd; border: 2px solid #1976d2; }
        .calendar-table td .appointments { margin-top: 0.2em; position: relative; z-index: 2; }
        .appointment { background: #1976d2; color: #fff; border-radius: 4px; padding: 2px 6px; font-size: 0.9em; margin-bottom: 2px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .calendar-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1em; }
        .calendar-nav button { background: #1976d2; color: #fff; border: none; border-radius: 4px; padding: 0.4em 1em; cursor: pointer; font-size: 1em; }
        .calendar-nav button:hover { background: #125ea7; }
        .blocked-time {
            background: repeating-linear-gradient(135deg, #bdbdbd 0px, #bdbdbd 8px, #fff 8px, #fff 16px);
            opacity: 0.5;
            position: absolute;
            left: 0; right: 0;
            top: 0; bottom: 0;
            z-index: 1;
            border-radius: 4px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Scheduler - Calendar View</h1>
        <div class="calendar-user-select" style="margin-bottom:1em;">
            <label for="userSelect"><b>Provider:</b></label>
            <select id="userSelect"></select>
            <button id="addUserBtn" title="Add provider to view">+</button>
        </div>
        <div id="activeUsers" style="margin-bottom:1em;"></div>
        <div class="calendar">
            <div class="calendar-nav">
                <button id="prevMonth">&#8592; Prev</button>
                <span id="monthYear"></span>
                <button id="nextMonth">Next &#8594;</button>
            </div>
            <table class="calendar-table">
                <thead>
                    <tr>
                        <th>Sun</th>
                        <th>Mon</th>
                        <th>Tue</th>
                        <th>Wed</th>
                        <th>Thu</th>
                        <th>Fri</th>
                        <th>Sat</th>
                    </tr>
                </thead>
                <tbody id="calendarBody">
                    <!-- Calendar days will be injected here -->
                </tbody>
            </table>
        </div>
        <script>
            const monthYear = document.getElementById('monthYear');
            const calendarBody = document.getElementById('calendarBody');
            const prevMonthBtn = document.getElementById('prevMonth');
            const nextMonthBtn = document.getElementById('nextMonth');
            const userSelect = document.getElementById('userSelect');
            const addUserBtn = document.getElementById('addUserBtn');
            const activeUsersDiv = document.getElementById('activeUsers');

            let today = new Date();
            let currentMonth = today.getMonth();
            let currentYear = today.getFullYear();
            let shifts = {};
            let providers = [];
            let activeUsers = [];

            function pad(n) { return n < 10 ? '0' + n : n; }

            async function fetchProviders() {
                const res = await fetch('https://scheduler-ro9c.onrender.com/providers');
                providers = await res.json();
                userSelect.innerHTML = '';
                providers.forEach((p, i) => {
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.textContent = p.name;
                    userSelect.appendChild(opt);
                });
            }

            async function fetchShifts(month, year, userNames) {
                const params = new URLSearchParams({ month: month+1, year });
                userNames.forEach(u => params.append('user', u));
                const res = await fetch(`https://scheduler-ro9c.onrender.com/shifts?${params}`);
                if (!res.ok) return {};
                return await res.json();
            }

            function renderActiveUsers() {
                activeUsersDiv.innerHTML = '';
                activeUsers.forEach((u, idx) => {
                    const span = document.createElement('span');
                    span.textContent = u;
                    span.style.marginRight = '1em';
                    const removeBtn = document.createElement('button');
                    removeBtn.textContent = 'x';
                    removeBtn.title = 'Remove from view';
                    removeBtn.style.marginLeft = '0.3em';
                    removeBtn.onclick = () => {
                        activeUsers.splice(idx, 1);
                        updateCalendar(currentMonth, currentYear);
                    };
                    span.appendChild(removeBtn);
                    activeUsersDiv.appendChild(span);
                });
            }

            function isBlockedTime(appts) {
                // Block if any shift overlaps with 12 PM - 5 AM (overnight)
                // Look for shifts with a time field, e.g. { time: '13:00', ... }
                // Block if any shift starts between 12:00 and 23:59 or before 05:00
                return appts.some(a => {
                    if (!a.time) return false;
                    const [h, m] = a.time.split(":").map(Number);
                    // 12:00 (noon) is 12, 5:00 is 5
                    return (h >= 12 || h < 5);
                });
            }

            function renderCalendar(month, year) {
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                let date = 1;
                let rows = '';
                for (let i = 0; i < 6; i++) {
                    let row = '<tr>';
                    for (let j = 0; j < 7; j++) {
                        if (i === 0 && j < firstDay) {
                            row += '<td></td>';
                        } else if (date > daysInMonth) {
                            row += '<td></td>';
                        } else {
                            let isToday = (date === today.getDate() && month === today.getMonth() && year === today.getFullYear());
                            let cellDate = `${year}-${pad(month+1)}-${pad(date)}`;
                            let appts = shifts[cellDate] || [];
                            let apptHtml = appts.map(a => {
                                let timeStr = (a.start_time && a.end_time) ? `<span class='shift-time'>${a.start_time} - ${a.end_time}</span>` : '';
                                return `<span class='appointment'>${timeStr} <b>${a.shift_type}</b> @ ${a.site} (${a.hours}h) <i>${a.provider || ''}</i></span>`;
                            }).join('');
                            let blocked = isBlockedTime(appts) ? "<div class='blocked-time' title='12 PM - 5 AM blocked'></div>" : "";
                            row += `<td class="${isToday ? 'today' : ''}"><div>${date}</div>${blocked}<div class='appointments'>${apptHtml}</div></td>`;
                            date++;
                        }
                    }
                    row += '</tr>';
                    rows += row;
                    if (date > daysInMonth) break;
                }
                calendarBody.innerHTML = rows;
                const shown = new Date(year, month, 1);
                monthYear.textContent = `${shown.toLocaleString('default', { month: 'long' })} ${year}`;
            }

            async function updateCalendar(month, year) {
                if (activeUsers.length === 0 && providers.length > 0) {
                    activeUsers = [providers[0].name];
                }
                renderActiveUsers();
                shifts = await fetchShifts(month, year, activeUsers);
                renderCalendar(month, year);
            }

            prevMonthBtn.onclick = async function() {
                currentMonth--;
                if (currentMonth < 0) {
                    currentMonth = 11;
                    currentYear--;
                }
                await updateCalendar(currentMonth, currentYear);
            };
            nextMonthBtn.onclick = async function() {
                currentMonth++;
                if (currentMonth > 11) {
                    currentMonth = 0;
                    currentYear++;
                }
                await updateCalendar(currentMonth, currentYear);
            };
            addUserBtn.onclick = async function() {
                const selected = userSelect.options[userSelect.selectedIndex].textContent;
                if (!activeUsers.includes(selected)) {
                    activeUsers.push(selected);
                    await updateCalendar(currentMonth, currentYear);
                }
            };

            // Initial load
            (async function() {
                await fetchProviders();
                await updateCalendar(currentMonth, currentYear);
            })();
        </script>
    </div>
</body>
</html>
